name: Build YoRadio Firmware for ES3C28P

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'yoRadio/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: 配置 ESP32 开发板核心库
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: 编译 YoRadio 固件
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,MSYS=dio,FlashMode=dio,FlashFreq=80,FlashSize=16M,PartitionScheme=default_16MB,PSRAM=opi \
            --output-dir build_output \
            yoRadio/yoRadio.ino

      - name: 合并为单文件固件
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name "boot_app0.bin" | head -n 1)
          cd build_output
          if [ -n "$BOOT_APP0" ]; then
            python -m esptool --chip esp32s3 merge_bin \
              -o yoradio_es3c28p_merged.bin \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 16MB \
              0x0 yoRadio.ino.bootloader.bin \
              0x8000 yoRadio.ino.partitions.bin \
              0xe000 "$BOOT_APP0" \
              0x10000 yoRadio.ino.bin
          else
            python -m esptool --chip esp32s3 merge_bin \
              -o yoradio_es3c28p_merged.bin \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 16MB \
              0x0 yoRadio.ino.bootloader.bin \
              0x8000 yoRadio.ino.partitions.bin \
              0x10000 yoRadio.ino.bin
          fi

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: YoRadio-ES3C28P-Firmware
          path: build_output/*.bin
