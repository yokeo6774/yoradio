name: Build YoRadio Firmware for ES3C28P

on:
  workflow_dispatch:
  push:
    paths:
      - 'yoRadio/myoptions.h'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 PlatformIO 与 esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 定位工程并执行编译
        run: |
          # 自动检测 platformio.ini 所在的工程目录
          if [ -f "yoRadio/platformio.ini" ]; then
            PROJECT_DIR="yoRadio"
          elif [ -f "platformio.ini" ]; then
            PROJECT_DIR="."
          else
            echo "未找到 platformio.ini"
            exit 1
          fi
          echo "Project Directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 自动匹配包含 s3 的构建环境，未匹配到则默认使用 esp32-s3
          S3_ENV=$(grep -E '^\[env:.*s3.*\]' platformio.ini | head -n 1 | tr -d '[]' | sed 's/env://')
          if [ -z "$S3_ENV" ]; then
            S3_ENV="esp32-s3"
          fi
          echo "Building for target environment: $S3_ENV"

          pio run -e "$S3_ENV"

          # 合并固件为单个 0x0 起始的 bin 文件
          BUILD_DIR=$(find .pio/build -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Build directory: $BUILD_DIR"
          if [ -f "$BUILD_DIR/bootloader.bin" ] && [ -f "$BUILD_DIR/partitions.bin" ] && [ -f "$BUILD_DIR/firmware.bin" ]; then
            python -m esptool --chip esp32s3 merge_bin \
              -o "$BUILD_DIR/merged_firmware.bin" \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 16MB \
              0x0 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
            echo "Successfully created merged_firmware.bin"
          fi

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: YoRadio-ES3C28P-Firmware
          path: |
            **/.pio/build/*/*.bin
