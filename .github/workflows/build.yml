name: Build YoRadio Firmware for ES3C28P

on:
  workflow_dispatch: # 支持在 Actions 页面手动点击触发
  push:
    paths:
      - 'yoRadio/myoptions.h'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装 PlatformIO 与 esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 执行编译 (ESP32-S3)
        run: |
          # 自动匹配 platformio.ini 中包含 s3 的环境名称，若未匹配则默认采用 esp32-s3
          S3_ENV=$(grep -E '^\[env:.*s3.*\]' platformio.ini | head -n 1 | tr -d '[]' | sed 's/env://')
          if [ -z "$S3_ENV" ]; then
            S3_ENV="esp32-s3"
          fi
          echo "Target Environment: $S3_ENV"
          pio run -e "$S3_ENV"

      - name: 合并为单个 0x0 烧录固件
        run: |
          BUILD_DIR=$(find .pio/build -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Build output directory: $BUILD_DIR"
          
          # 检查编译产物并自动合成为单文件 bin
          if [ -f "$BUILD_DIR/bootloader.bin" ] && [ -f "$BUILD_DIR/partitions.bin" ] && [ -f "$BUILD_DIR/firmware.bin" ]; then
            python -m esptool --chip esp32s3 merge_bin \
              -o "$BUILD_DIR/merged_firmware.bin" \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 16MB \
              0x0 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
            echo "Merged binary generated successfully at $BUILD_DIR/merged_firmware.bin"
          fi

      - name: 上传固件产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: YoRadio-ES3C28P-Firmware
          path: |
            .pio/build/*/*.bin
