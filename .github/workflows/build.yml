name: Build YoRadio Firmware for ES3C28P

on:
  workflow_dispatch:
  push:
    paths:
      - 'yoRadio/myoptions.h'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 PlatformIO 与 esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: 定位工程并编译
        run: |
          echo "=== 检索 platformio.ini 路径 ==="
          INI_PATH=$(find . -name "platformio.ini" | head -n 1)
          if [ -z "$INI_PATH" ]; then
            echo "错误：仓库内未找到 platformio.ini 配置文件"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$INI_PATH")
          echo "定位到项目根目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "=== 查看 platformio.ini 中的所有可用环境 ==="
          grep -E '^\[env:' platformio.ini

          # 优先提取带 s3 的环境名；若无则自动选取文件中声明的第一个默认环境
          TARGET_ENV=$(grep -E '^\[env:.*s3.*\]' platformio.ini | head -n 1 | sed -E 's/\[env:(.*)\]/\1/' | tr -d ' ')
          if [ -z "$TARGET_ENV" ]; then
            TARGET_ENV=$(grep -E '^\[env:.*\]' platformio.ini | head -n 1 | sed -E 's/\[env:(.*)\]/\1/' | tr -d ' ')
          fi
          echo ">>> 选定构建环境: $TARGET_ENV <<<"

          # 执行编译
          pio run -e "$TARGET_ENV"

          # 自动合并三合一固件
          BUILD_DIR=$(find .pio/build -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "产物路径: $BUILD_DIR"
          if [ -f "$BUILD_DIR/bootloader.bin" ] && [ -f "$BUILD_DIR/partitions.bin" ] && [ -f "$BUILD_DIR/firmware.bin" ]; then
            python -m esptool --chip esp32s3 merge_bin \
              -o "$BUILD_DIR/merged_firmware.bin" \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 16MB \
              0x0 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
            echo "单文件固件合并成功！"
          fi

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: YoRadio-ES3C28P-Firmware
          path: |
            **/.pio/build/*/*.bin
